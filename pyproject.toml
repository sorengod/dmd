[project]
name = "dmd-dashboard"
version = "0.1.0"
description = "DMD Beer Club Dashboard"
authors = [
    { name = "Søren Godbersen", email = "sgn@systematic.com" }
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dash (>=3.3.0,<4.0.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "dash-bootstrap-components (>=2.0.4,<3.0.0)",
    "dash-ag-grid (>=32.3.2,<33.0.0)",
    "gunicorn (>=23.0.0,<24.0.0)"
]

[tool.poetry]
package-mode = false   # ← THIS IS THE SOLUTION

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
